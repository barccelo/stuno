name: Verify power card UI refinement

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --progress=false
      - name: Build with UI refinement
        run: |
          npm run prebuild
          node scripts/apply-power-card-ui-refinement.mjs
          npx vinext build

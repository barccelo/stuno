name: Verify build

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --progress=false
      - name: Inspect generated Contiene logic
        shell: bash
        run: |
          npm run prebuild || true
          echo "--- CLIENTE ---"
          grep -n -C 2 'contains-toggle' app/page.tsx || true
          grep -n -C 2 'Ñ' app/page.tsx | tail -80 || true
          echo "--- SERVIDOR ---"
          grep -n -C 2 'mode === "contains"' app/api/rooms/route.ts || true
          grep -n -C 2 'Ñ' app/api/rooms/route.ts | head -80 || true

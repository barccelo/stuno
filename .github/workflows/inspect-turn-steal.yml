name: Inspect turn steal

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --progress=false
      - name: Inspect generated turn flow
        shell: bash
        run: |
          npm run prebuild
          echo '--- SELECT CARD ---'
          awk '/function selectCard\(/,/function startDrag\(/' app/page.tsx | head -220
          echo '--- PLAY ACTION ---'
          awk '/else if \(action === "play"\)/,/else if \(action === "pass"\)/' app/api/rooms/route.ts | head -340
          echo '--- CREATE SETTINGS UI ---'
          grep -n -C 8 'startDelaySeconds\|playStyle\|turnSeconds' app/page.tsx | head -260
          echo '--- CARD BUTTON ---'
          grep -n -C 8 'selectCard(card' app/page.tsx | head -180
          echo '--- GAMESTATE SETTINGS ---'
          grep -n -C 6 'settings:' lib/game.ts | head -100

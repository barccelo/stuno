name: Inspect turn steal

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --progress=false
      - name: Inspect generated turn flow
        shell: bash
        run: |
          npm run prebuild
          set +o pipefail
          echo '--- REQUEST/ACT ---'
          awk '/async function request\(/,/function animatePlay\(/' app/page.tsx | head -260
          echo '--- CAN PLAY ---'
          grep -n -C 18 'const canPlay = Boolean' app/page.tsx | head -120
          echo '--- CARD BUTTON OPENING ---'
          sed -n '2918,2955p' app/page.tsx
          echo '--- CREATE FORM OPTIONS ---'
          sed -n '3760,3845p' app/page.tsx

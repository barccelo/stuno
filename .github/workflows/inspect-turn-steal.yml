name: Inspect turn steal

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --progress=false
      - name: Inspect generated turn flow
        shell: bash
        run: |
          npm run prebuild
          set +o pipefail
          echo '--- PLAY ACTION ---'
          awk '/else if \(action === "play"\)/,/else if \(action === "pass"\)/' app/api/rooms/route.ts | head -420
          echo '--- CREATE SETTINGS UI ---'
          grep -n -C 10 'startDelaySeconds\|playStyle\|turnSeconds' app/page.tsx | head -320
          echo '--- CARD BUTTON ---'
          grep -n -C 10 'selectCard(card' app/page.tsx | head -220
          echo '--- PLAY SELECTED ---'
          awk '/function playSelectedCard\(/,/function selectCard\(/' app/page.tsx | head -240
          echo '--- GAMESTATE SETTINGS ---'
          grep -n -C 8 'settings:' lib/game.ts | head -140

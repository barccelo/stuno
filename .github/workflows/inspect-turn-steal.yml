name: Inspect turn steal

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --progress=false
      - name: Apply and verify turn steal
        run: |
          npm run prebuild
          node scripts/apply-turn-steal.mjs
          node scripts/apply-turn-steal.mjs
          grep -q 'turn-steal-ready' app/page.tsx
          grep -q 'applyTurnStealAtomically' app/api/rooms/route.ts
      - run: npm run build
